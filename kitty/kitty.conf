# Tokyo Night color scheme for kitty terminal emulator
# https://github.com/davidmathers/tokyo-night-kitty-theme
#
# Based on Tokyo Night color theme for Visual Studio Code
# https://github.com/enkia/tokyo-night-vscode-theme

font_family Iosevka
font_size 14

map ctrl+shift+j previous_tab
map ctrl+shift+k next_tab
map ctrl+shift+o new_tab_with_cwd
map ctrl+shift+r load_config_file

update_check_interval 0
shell nu

tab_bar_style powerline
tab_powerline_style round
tab_separator " - "
tab_bar_margin_width 10.0
tab_bar_margin_height 2.0 0.0

include ./theme.conf
