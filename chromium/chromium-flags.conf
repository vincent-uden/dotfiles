# Ungoogled Chromium flags - managed via dotfiles
# See chrome://flags or `chromium --help` for all options

# Allow installing .crx extensions from any website
--extension-mime-request-handling=always-prompt

# Dark mode browser UI
--force-dark-mode

# Privacy: remove client hints (system info leakage)
--remove-client-hints

# Privacy: remove cross-origin referrers
--remove-cross-origin-referrers

# Privacy: remove all referrers (supersedes the above)
--remove-referrers
